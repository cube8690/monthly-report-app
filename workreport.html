<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Report Generator</title>
  <style>
    /* 全体・画面表示用の共通スタイル（背景白ベース） */
    :root {
      --primary-color: #2563eb;
      --bg-color: #ffffff;
      --text-color: #1e293b;
      --border-color: #cbd5e1;
      --stripe-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", meiryo, sans-serif;
    }

    /* -----------------------------------
       画面1: パラメータ選択画面 (英語表記)
    ----------------------------------- */
    #selection-screen {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    #selection-screen h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 24px;
      color: #0f172a;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 1rem;
      background-color: #fff;
    }

    .flex-row {
      display: flex;
      gap: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    /* -----------------------------------
       画面2: 業務レポート（日本語・A4印刷用）
    ----------------------------------- */
    #report-screen {
      display: none; /* 初期状態は非表示 */
      width: 210mm;  /* A4横幅 */
      margin: 20px auto;
      padding: 15mm;
      background-color: #fff;
    }

    .no-print-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 16px;
      background-color: #f1f5f9;
      border-radius: 6px;
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #fff;
      border: none;
    }

    /* レポートヘッダー */
    .report-title {
      font-size: 1.8rem;
      text-align: center;
      margin: 0 0 24px 0;
      letter-spacing: 2px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 10px;
    }

    /* ①&② 日付と氏名 */
    .report-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    .report-date {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .name-input-box {
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name-input-box input {
      border: none;
      border-bottom: 1px solid #000;
      font-size: 1.1rem;
      padding: 2px 8px;
      width: 180px;
      outline: none;
    }

    /* ③&④ サマリーエリア (全体の合計 & 部門別合計) */
    .summary-container {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .total-card {
      flex: 1;
      border: 2px solid #0f172a;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      background-color: #fafafa;
    }

    .total-card .label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #475569;
    }

    .total-card .value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #0f172a;
      margin-top: 4px;
    }

    .dept-table {
      flex: 2;
      border-collapse: collapse;
      width: 100%;
    }

    .dept-table th, .dept-table td {
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      font-size: 0.85rem;
      text-align: center;
    }

    .dept-table th {
      background-color: #f1f5f9;
    }

    /* ⑤ レコード一覧テーブル */
    .records-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .records-table th, .records-table td {
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      font-size: 0.85rem;
      text-align: left;
    }

    .records-table th {
      background-color: #0f172a;
      color: #ffffff;
    }

    /* ゼブラパターン（行の交互色付け） */
    .records-table tbody tr:nth-child(even) {
      background-color: var(--stripe-bg);
    }

    /* -----------------------------------
       A4 印刷用メディアクエリ (@media print)
    ----------------------------------- */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }

      body {
        background-color: #fff;
      }

      .no-print, .no-print-bar {
        display: none !important;
      }

      #report-screen {
        display: block !important;
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }

      .name-input-box input {
        border-bottom: none; /* 印刷時は下線を消す */
      }

      .records-table th {
        background-color: #e2e8f0 !important;
        color: #000 !important;
      }

      .records-table tbody tr:nth-child(even) {
        background-color: #f8fafc !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- 画面1: 選択画面 (English) -->
  <div id="selection-screen" class="no-print">
    <h1>Work Report Output</h1>
    
    <div class="form-group">
      <label>Select Target Month</label>
      <div class="flex-row">
        <select id="select-year" class="form-control"></select>
        <select id="select-month" class="form-control"></select>
      </div>
    </div>

    <button id="btn-generate" class="btn-submit" onclick="generateReport()">Generate Report</button>
  </div>

  <!-- 画面2: 印刷用レポート画面 (日本語) -->
  <div id="report-screen">
    
    <!-- 画面表示時のみ出す操作バー -->
    <div class="no-print-bar no-print">
      <button class="btn-action" onclick="backToSelection()">← 年月選択に戻る</button>
      <button class="btn-action btn-primary" onclick="window.print()">印刷 / PDF出力</button>
    </div>

    <!-- 印刷コンテンツ -->
    <div class="report-header">
      <h1 class="report-title">業 務 月 報</h1>
    </div>

    <div class="report-meta">
      <!-- ① 年月表示 -->
      <div id="report-date-display" class="report-date">2026年 8月度</div>
      <!-- ② 氏名入力欄 -->
      <div class="name-input-box">
        <span>氏名:</span>
        <input type="text" id="worker-name" placeholder="氏名を入力">
      </div>
    </div>

    <!-- 集計エリア -->
    <div class="summary-container">
      <!-- ③ 作業時間合計 -->
      <div class="total-card">
        <div class="label">月間作業時間合計</div>
        <div id="total-duration" class="value">0.0 時間</div>
      </div>

      <!-- ④ 部門別合計時間 -->
      <table class="dept-table">
        <thead>
          <tr>
            <th>不動産部門</th>
            <th>GH部門</th>
            <th>Cre部門</th>
            <th>清掃部門</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="dept-realestate">0.0 時間</td>
            <td id="dept-grouphome">0.0 時間</td>
            <td id="dept-creative">0.0 時間</td>
            <td id="dept-cleaning">0.0 時間</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ⑤ レコード一覧 -->
    <table class="records-table">
      <thead>
        <tr>
          <th style="width: 15%;">日付</th>
          <th style="width: 18%;">時間</th>
          <th style="width: 18%;">業務区分</th>
          <th style="width: 12%;">作業時間</th>
          <th style="width: 37%;">メモ</th>
        </tr>
      </thead>
      <tbody id="records-table-body">
        <!-- JSで動的に追加 -->
      </tbody>
    </table>
  </div>

  <script>
    // 既存のGAS Web App URLを設定
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxqskMRUTlqzxyweydMGBnabTYRxwWwqi6C6EemWoUnlkTwnuZ8pdp2Rk-JUVVOOFs5VQ/exec";

    // 業務区分の日本語変換マップ
    const DEPT_MAP = {
      "Real Estate": "不動産部門",
      "Group Home": "GH部門",
      "Creative": "Cre部門",
      "Cleaning": "清掃部門"
    };

    // 初期化: ドラムロール（年・月）の動的生成
    window.addEventListener("DOMContentLoaded", () => {
      const yearSelect = document.getElementById("select-year");
      const monthSelect = document.getElementById("select-month");
      
      const currentYear = new Date().getFullYear();
      
      // 年のドラムロール (過去2年〜翌年)
      for (let y = currentYear - 2; y <= currentYear + 1; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = `${y} Year`;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      // 月のドラムロール (1〜12月)
      const currentMonth = new Date().getMonth() + 1;
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement("option");
        opt.value = String(m).padStart(2, "0");
        opt.textContent = `${m} Month`;
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }
    });

    // レポート生成処理
    function generateReport() {
      const year = document.getElementById("select-year").value;
      const month = document.getElementById("select-month").value;

      const btn = document.getElementById("btn-generate");
      btn.disabled = true;
      btn.textContent = "Loading...";

      // 月初と月末の日付文字列を生成 (例: 2026-08-01 〜 2026-08-31)
      const startDate = `${year}-${month}-01`;
      const lastDay = new Date(year, month, 0).getDate();
      const endDate = `${year}-${month}-${String(lastDay).padStart(2, "0")}`;

      const fetchUrl = `${GAS_URL}?start=${startDate}&end=${endDate}`;

      fetch(fetchUrl)
        .then(res => res.json())
        .then(data => {
          renderReportView(year, month, data);
        })
        .catch(err => {
          console.error(err);
          alert("Error: Failed to fetch report data.");
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = "Generate Report";
        });
    }

    // 画面切り替えとデータの描画
    function renderReportView(year, month, data) {
      // ① 日付表示更新
      document.getElementById("report-date-display").textContent = `${year}年 ${parseInt(month, 10)}月度 月報`;

      let totalDuration = 0;
      const deptTotals = {
        "Real Estate": 0,
        "Group Home": 0,
        "Creative": 0,
        "Cleaning": 0
      };

      const tbody = document.getElementById("records-table-body");
      tbody.innerHTML = "";

      // 日付順にソートして展開
      const sortedDates = Object.keys(data).sort();

      sortedDates.forEach(dateStr => {
        data[dateStr].forEach(item => {
          const dur = parseFloat(item.duration) || 0;
          totalDuration += dur;

          if (deptTotals.hasOwnProperty(item.dept)) {
            deptTotals[item.dept] += dur;
          }

          // ⑤ テーブル行作成
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${dateStr}</td>
            <td>${item.startTime} - ${item.endTime}</td>
            <td>${DEPT_MAP[item.dept] || item.dept}</td>
            <td>${dur.toFixed(1)} h</td>
            <td>${escapeHtml(item.memo)}</td>
          `;
          tbody.appendChild(tr);
        });
      });

      // ③ 全体合計時間
      document.getElementById("total-duration").textContent = `${totalDuration.toFixed(1)} 時間`;

      // ④ 部門別合計時間
      document.getElementById("dept-realestate").textContent = `${deptTotals["Real Estate"].toFixed(1)} 時間`;
      document.getElementById("dept-grouphome").textContent = `${deptTotals["Group Home"].toFixed(1)} 時間`;
      document.getElementById("dept-creative").textContent = `${deptTotals["Creative"].toFixed(1)} 時間`;
      document.getElementById("dept-cleaning").textContent = `${deptTotals["Cleaning"].toFixed(1)} 時間`;

      // 画面切り替え
      document.getElementById("selection-screen").style.display = "none";
      document.getElementById("report-screen").style.display = "block";
    }

    function backToSelection() {
      document.getElementById("report-screen").style.display = "none";
      document.getElementById("selection-screen").style.display = "block";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
