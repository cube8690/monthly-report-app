<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Work Log App</title>
    <!-- Chart.js for 24h Donut Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
            --accent-color: #2dd4bf;
            --border-color: #334155;
            --error-color: #f87171;
            --error-bg: #450a0a;
            --today-border: #38bdf8;
            --today-bg: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        .screen {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .screen.active {
            display: block;
        }

        /* Calendar Screen Header */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header h2 {
            font-size: 1.3rem;
            color: var(--text-main);
        }

        .btn-nav {
            background-color: var(--border-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }

        /* Fixed Calendar Grid Layout (Prevents misalignment) */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            width: 100%;
        }

        .day-header {
            font-weight: bold;
            padding: 8px 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
        }

        .day-header.sun { color: #f87171; }
        .day-header.sat { color: #60a5fa; }

        .day-cell {
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #182232;
            position: relative;
        }

        .day-cell:hover {
            background-color: #243348;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .day-cell.empty {
            background: rgba(255, 255, 255, 0.01);
            border-color: transparent;
            cursor: default;
        }

        .day-cell .day-num {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-main);
        }

        .day-cell.sun .day-num { color: #f87171; }
        .day-cell.sat .day-num { color: #60a5fa; }

        /* Today Highlight */
        .day-cell.today {
            border: 2px solid var(--today-border);
            background: var(--today-bg);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .day-cell.today .day-num::after {
            content: 'TODAY';
            display: block;
            font-size: 0.55rem;
            color: var(--primary-color);
            text-align: center;
            line-height: 1;
            margin-top: 2px;
        }

        /* Record Marker in Calendar */
        .record-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 0.72rem;
            color: var(--accent-color);
            background: rgba(45, 212, 191, 0.1);
            padding: 2px 5px;
            border-radius: 10px;
            margin-top: 4px;
            width: 100%;
            justify-content: center;
        }

        .record-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
        }

        /* Input Screen Header */
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 20px auto;
        }

        .overlap-warning {
            display: none;
            background-color: var(--error-bg);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Record Cards */
        .records-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .record-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-title {
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .color-badge {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .time-row, .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .field-group {
            flex: 1;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .field-group input[type="text"],
        .field-group select,
        .field-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .field-group input[readonly] {
            background-color: #090d16;
            color: var(--text-muted);
        }

        .slider-group {
            margin-bottom: 12px;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .btn-add-record {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--primary-color);
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .btn-add-record:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #059669;
        }

        .gas-config {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .gas-config input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Monthly Work Log System</h1>
    </header>

    <!-- Screen 1: Calendar View -->
    <div id="screen-calendar" class="screen active">
        <div class="calendar-header">
            <button class="btn-nav" onclick="changeMonth(-1)">◀ Prev</button>
            <h2 id="calendar-month-title">August 2026</h2>
            <button class="btn-nav" onclick="changeMonth(1)">Next ▶</button>
        </div>

        <!-- Single Grid Container for Headers & Day Cells -->
        <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- Screen 2: Input & Edit View -->
    <div id="screen-input" class="screen">
        <div class="input-header">
            <button class="btn-nav" onclick="showCalendarScreen()">◀ Calendar</button>
            <h2 id="selected-date-display">2026-08-14</h2>
            <div></div>
        </div>

        <!-- 24h Donut Chart -->
        <div class="chart-container">
            <canvas id="timeChart"></canvas>
        </div>

        <!-- Time Overlap Alert -->
        <div id="overlap-warning" class="overlap-warning">
            ⚠️ Warning: Time slots are overlapping! Please check your records.
        </div>

        <!-- Record List -->
        <div id="records-container" class="records-container"></div>

        <!-- Add Button -->
        <button class="btn-add-record" onclick="addRecord()">+ Add Work Record</button>

        <!-- Submit Button -->
        <button class="btn-submit" onclick="submitData()">Save & Submit to Sheet</button>

        <!-- Webhook Config -->
        <div class="gas-config">
            <details>
                <summary>⚙️ Settings: GAS Web App URL</summary>
                <label style="margin-top:8px; display:block;">GAS Web App URL (exec):</label>
                <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" onchange="saveGasUrl()">
            </details>
        </div>
    </div>

    <script>
        const COLOR_PALETTE = [
            '#38bdf8', '#34d399', '#fbbf24', '#f87171', '#c084fc',
            '#2dd4bf', '#fb923c', '#a78bfa', '#f472b6', '#4ade80'
        ];
        const OVERLAP_COLOR = '#ef4444';

        // English Department List
        const DEPARTMENTS = [
            'Real Estate',
            'Group Home',
            'Creative',
            'Cleaning',
            'General Admin'
        ];

        const MONTH_NAMES = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        let currentYear = 2026;
        let currentMonth = 7; // 0-indexed (7 = August)
        let selectedDateStr = '';
        let records = [];
        let timeChart = null;
        let monthlyData = {}; // Cache for existing records from GAS { "2026-08-14": [records] }

        window.onload = () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            initChart();

            const savedUrl = localStorage.getItem('gas_app_url');
            if(savedUrl) {
                document.getElementById('gas-url').value = savedUrl;
            }

            fetchMonthlyData();
        };

        function saveGasUrl() {
            const url = document.getElementById('gas-url').value.trim();
            localStorage.setItem('gas_app_url', url);
            fetchMonthlyData();
        }

        /* ----- Fetch Existing Data from GAS (Re-edit Support) ----- */
        function fetchMonthlyData() {
            const gasUrl = document.getElementById('gas-url').value.trim();
            if (!gasUrl) {
                renderCalendar();
                return;
            }

            // Fetch registered data from GAS
            fetch(`${gasUrl}?action=getRecords&year=${currentYear}&month=${currentMonth + 1}`)
                .then(res => res.json())
                .then(data => {
                    monthlyData = data || {};
                    renderCalendar();
                })
                .catch(err => {
                    console.log('Fetching existing records failed or offline:', err);
                    renderCalendar();
                });
        }

        /* ----- Calendar Render (Grid Alignment Fixed) ----- */
        function changeMonth(diff) {
            currentMonth += diff;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            fetchMonthlyData();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-title').textContent = `${MONTH_NAMES[currentMonth]} ${currentYear}`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            // 1. Render Weekday Headers
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekdays.forEach((day, idx) => {
                const header = document.createElement('div');
                header.className = 'day-header';
                if (idx === 0) header.classList.add('sun');
                if (idx === 6) header.classList.add('sat');
                header.textContent = day;
                grid.appendChild(header);
            });

            // 2. Render Blank & Day Cells
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const totalDays = lastDay.getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;

            // Empty cells before month start
            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // Day cells
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const dayOfWeekIdx = (startDayOfWeek + day - 1) % 7;
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                cell.className = 'day-cell';
                if (dayOfWeekIdx === 0) cell.classList.add('sun');
                if (dayOfWeekIdx === 6) cell.classList.add('sat');

                // Check Today
                if (isCurrentMonth && day === today.getDate()) {
                    cell.classList.add('today');
                }

                // Check if existing records exist
                const dayRecords = monthlyData[dateStr] || [];
                let totalHours = 0;
                dayRecords.forEach(r => totalHours += Number(r.duration || 0));

                let badgeHtml = '';
                if (dayRecords.length > 0) {
                    badgeHtml = `
                        <div class="record-badge">
                            <span class="record-dot"></span>
                            <span>${totalHours}h</span>
                        </div>
                    `;
                }

                cell.innerHTML = `
                    <div class="day-num">${day}</div>
                    ${badgeHtml}
                `;

                cell.onclick = () => selectDate(dateStr, dayRecords);
                grid.appendChild(cell);
            }
        }

        function selectDate(dateStr, existingRecords) {
            selectedDateStr = dateStr;
            document.getElementById('selected-date-display').textContent = `Logs for ${selectedDateStr}`;

            records = [];
            if (existingRecords && existingRecords.length > 0) {
                // Restore existing records for Editing
                records = JSON.parse(JSON.stringify(existingRecords));
            } else {
                // Initial Default Record
                addRecord('09:00', 1);
            }

            renderRecords();
            updateChartAndValidation();

            document.getElementById('screen-calendar').classList.remove('active');
            document.getElementById('screen-input').classList.add('active');
        }

        function showCalendarScreen() {
            document.getElementById('screen-input').classList.remove('active');
            document.getElementById('screen-calendar').classList.add('active');
        }

        /* ----- Record Management ----- */
        function addRecord(defaultStart = null, defaultDuration = 1) {
            let start = defaultStart;
            if (!start) {
                if (records.length > 0) {
                    start = records[records.length - 1].endTime;
                } else {
                    start = '09:00';
                }
            }

            const color = COLOR_PALETTE[records.length % COLOR_PALETTE.length];
            const newRecord = {
                id: Date.now() + Math.random(),
                startTime: start,
                duration: defaultDuration,
                endTime: calculateEndTime(start, defaultDuration),
                dept: DEPARTMENTS[0],
                memo: '',
                color: color
            };

            records.push(newRecord);
            renderRecords();
            updateChartAndValidation();
        }

        function deleteRecord(id) {
            if (records.length <= 1) {
                alert('At least one record is required.');
                return;
            }
            records = records.filter(r => r.id !== id);
            renderRecords();
            updateChartAndValidation();
        }

        function calculateEndTime(startStr, durationHours) {
            if (!startStr || !startStr.includes(':')) return '00:00';
            const parts = startStr.split(':');
            let h = parseInt(parts[0], 10) || 0;
            let m = parseInt(parts[1], 10) || 0;

            let endH = h + parseInt(durationHours, 10);
            return `${String(endH).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function updateRecordField(id, field, value) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            if (field === 'startTime') {
                rec.startTime = value;
                rec.endTime = calculateEndTime(rec.startTime, rec.duration);
            } else if (field === 'duration') {
                rec.duration = parseInt(value, 10);
                rec.endTime = calculateEndTime(rec.startTime, rec.duration);
            } else if (field === 'dept') {
                rec.dept = value;
            } else if (field === 'memo') {
                rec.memo = value;
            }

            const endInput = document.getElementById(`end-time-${id}`);
            if (endInput) endInput.value = rec.endTime;

            const durationDisplay = document.getElementById(`duration-val-${id}`);
            if (durationDisplay) durationDisplay.textContent = `${rec.duration} hr(s)`;

            updateChartAndValidation();
        }

        function renderRecords() {
            const container = document.getElementById('records-container');
            container.innerHTML = '';

            records.forEach((rec, idx) => {
                const card = document.createElement('div');
                card.className = 'record-card';
                card.style.borderLeftColor = rec.color || COLOR_PALETTE[idx % COLOR_PALETTE.length];

                const deptOptions = DEPARTMENTS.map(d => 
                    `<option value="${d}" ${rec.dept === d ? 'selected' : ''}>${d}</option>`
                ).join('');

                card.innerHTML = `
                    <div class="record-header">
                        <div class="record-title">
                            <span class="color-badge" style="background:${rec.color};"></span>
                            Record #${idx + 1}
                        </div>
                        ${records.length > 1 ? `<button class="btn-delete" onclick="deleteRecord(${rec.id})">Delete</button>` : ''}
                    </div>

                    <div class="time-row">
                        <div class="field-group">
                            <label>① Start Time (Manual)</label>
                            <input type="text" placeholder="09:00" value="${rec.startTime}" 
                                onchange="updateRecordField(${rec.id}, 'startTime', this.value)">
                        </div>
                        <div class="field-group">
                            <label>② End Time (Auto)</label>
                            <input type="text" id="end-time-${rec.id}" value="${rec.endTime}" readonly>
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>③ Duration Slider (Max 12h)</span>
                            <span id="duration-val-${rec.id}" style="color:var(--primary-color); font-weight:bold;">${rec.duration} hr(s)</span>
                        </div>
                        <input type="range" min="1" max="12" step="1" value="${rec.duration}"
                            oninput="updateRecordField(${rec.id}, 'duration', this.value)">
                    </div>

                    <div class="form-row">
                        <div class="field-group">
                            <label>④ Category / Department</label>
                            <select onchange="updateRecordField(${rec.id}, 'dept', this.value)">
                                ${deptOptions}
                            </select>
                        </div>
                    </div>

                    <div class="field-group">
                        <label>⑤ Notes / Details</label>
                        <textarea rows="2" placeholder="Tasks completed, notes, etc." 
                            onchange="updateRecordField(${rec.id}, 'memo', this.value)">${rec.memo || ''}</textarea>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /* ----- Chart & Validation Logic ----- */
        function initChart() {
            const ctx = document.getElementById('timeChart').getContext('2d');
            timeChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderWidth: 0 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}` } }
                    }
                }
            });
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr || !timeStr.includes(':')) return 0;
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function updateChartAndValidation() {
            const minutesInDay = 24 * 60;
            const usage = new Array(minutesInDay).fill(0);
            const recordUsage = new Array(minutesInDay).fill(null);
            let hasOverlap = false;

            records.forEach(rec => {
                const startMin = parseTimeToMinutes(rec.startTime);
                const endMin = startMin + (rec.duration * 60);

                for (let m = startMin; m < endMin; m++) {
                    const normM = m % minutesInDay;
                    usage[normM] += 1;
                    if (usage[normM] > 1) hasOverlap = true;
                    recordUsage[normM] = rec;
                }
            });

            document.getElementById('overlap-warning').style.display = hasOverlap ? 'block' : 'none';

            const chartLabels = [], chartData = [], chartColors = [];
            let currentSeg = null;

            for (let m = 0; m < minutesInDay; m++) {
                const state = usage[m];
                let color = '#334155';
                let label = 'Empty Slot';

                if (state > 1) {
                    color = OVERLAP_COLOR;
                    label = '⚠️ Overlap Error';
                } else if (state === 1) {
                    const rec = recordUsage[m];
                    color = rec.color;
                    label = `${rec.startTime}~ ${rec.dept}: ${rec.memo || 'Work'}`;
                }

                if (!currentSeg || currentSeg.color !== color || currentSeg.label !== label) {
                    if (currentSeg) {
                        chartLabels.push(currentSeg.label);
                        chartData.push(currentSeg.count);
                        chartColors.push(currentSeg.color);
                    }
                    currentSeg = { label, color, count: 1 };
                } else {
                    currentSeg.count++;
                }
            }

            if (currentSeg) {
                chartLabels.push(currentSeg.label);
                chartData.push(currentSeg.count);
                chartColors.push(currentSeg.color);
            }

            timeChart.data.labels = chartLabels;
            timeChart.data.datasets[0].data = chartData;
            timeChart.data.datasets[0].backgroundColor = chartColors;
            timeChart.update();
        }

        /* ----- Data Submit (Update / Save) ----- */
        function submitData() {
            const gasUrl = document.getElementById('gas-url').value.trim();

            const payload = {
                date: selectedDateStr,
                records: records
            };

            if (!gasUrl) {
                alert("GAS Web App URL is missing. Please configure it in settings below.\n\nPreview Data:\n" + JSON.stringify(payload, null, 2));
                return;
            }

            // Send to GAS
            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('Saved successfully!');
                // Update local cache
                monthlyData[selectedDateStr] = records;
                showCalendarScreen();
                renderCalendar();
            })
            .catch(err => {
                alert('Failed to submit: ' + err.message);
            });
        }
    </script>
</body>
</html>
