<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報・月報データ入力アプリ</title>
    <!-- Chart.js for 24h Donut/Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2b579a;
            --primary-hover: #1e3d6e;
            --accent-color: #008080;
            --border-color: #dddddd;
            --error-color: #e74c3c;
            --error-bg: #fde8e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Meiryo';
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .screen {
            display: none;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .screen.active {
            display: block;
        }

        /* Calendar Screen */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 1.4rem;
            color: var(--primary-color);
        }

        .btn-nav {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-nav:hover {
            background-color: var(--primary-hover);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .day-header {
            font-weight: bold;
            padding: 10px 0;
            background: #eef2f7;
            border-radius: 4px;
        }

        .day-header.sun { color: #e74c3c; }
        .day-header.sat { color: #2980b9; }

        .day-cell {
            padding: 15px 5px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .day-cell:hover {
            background-color: #e8f0fe;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .day-cell.empty {
            background: #f9f9f9;
            border-color: #eee;
            cursor: default;
        }

        .day-cell .day-num {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .day-cell .day-week {
            font-size: 0.8rem;
            color: #666;
        }

        .day-cell.sun .day-num { color: #e74c3c; }
        .day-cell.sat .day-num { color: #2980b9; }

        /* Input Screen */
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .chart-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 25px auto;
        }

        .overlap-warning {
            display: none;
            background-color: var(--error-bg);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* Record Cards */
        .records-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 25px;
        }

        .record-card {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-left: 6px solid #2b579a;
            border-radius: 8px;
            padding: 18px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-title {
            font-weight: bold;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background: #cc0000;
        }

        .time-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .field-group {
            flex: 1;
        }

        .field-group label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .field-group input[type="text"],
        .field-group select,
        .field-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .field-group input[readonly] {
            background-color: #eee;
            color: #555;
            cursor: not-allowed;
        }

        .slider-group {
            margin-bottom: 15px;
            background: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .slider-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .btn-add-record {
            width: 100%;
            padding: 12px;
            background-color: #eef2f7;
            color: var(--primary-color);
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 25px;
        }

        .btn-add-record:hover {
            background-color: #e0e8f5;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #219150;
        }

        /* Settings Modal / Webhook config */
        .gas-config {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: #666;
        }

        .gas-config input {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            font-size: 0.85rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>業務月報 記録システム</h1>
    </header>

    <!-- 画面1: カレンダー選択画面 -->
    <div id="screen-calendar" class="screen active">
        <div class="calendar-header">
            <button class="btn-nav" onclick="changeMonth(-1)">◀ 前月</button>
            <h2 id="calendar-month-title">2026年 8月</h2>
            <button class="btn-nav" onclick="changeMonth(1)">次月 ▶</button>
        </div>

        <div class="calendar-grid">
            <div class="day-header sun">日</div>
            <div class="day-header">月</div>
            <div class="day-header">火</div>
            <div class="day-header">水</div>
            <div class="day-header">木</div>
            <div class="day-header">金</div>
            <div class="day-header sat">土</div>
        </div>
        <div id="calendar-days" class="calendar-grid" style="margin-top: 8px;"></div>
    </div>

    <!-- 画面2: 入力エリア画面 -->
    <div id="screen-input" class="screen">
        <div class="input-header">
            <button class="btn-nav" onclick="showCalendarScreen()">◀ カレンダーに戻る</button>
            <h2 id="selected-date-display">2026-08-14 (金) の作業記録</h2>
            <div></div>
        </div>

        <!-- 24時間円グラフ -->
        <div class="chart-container">
            <canvas id="timeChart"></canvas>
        </div>

        <!-- 時間重複エラー警告アラート -->
        <div id="overlap-warning" class="overlap-warning">
            ⚠️ 警告: 入力された作業時間の間に重複が発生しています！グラフおよび時間枠をご確認ください。
        </div>

        <!-- レコード一覧 -->
        <div id="records-container" class="records-container"></div>

        <!-- レコード追加ボタン -->
        <button class="btn-add-record" onclick="addRecord()">＋ 業務レコードを追加する</button>

        <!-- 送信ボタン -->
        <button class="btn-submit" onclick="submitData()">スプレッドシートへ送信</button>

        <!-- GAS Web App URL設定 -->
        <div class="gas-config">
            <details>
                <summary>⚙ Webhook / GAS送信先URLの設定</summary>
                <label style="margin-top:8px; display:block;">GAS Web アプリ URL (exec):</label>
                <input type="text" id="gas-url" placeholder="https://script.google.com/macros/s/.../exec" value="" onchange="saveGasUrl()">
            </details>
        </div>
    </div>

    <script>
        // 色パレット（レコード毎のユニークカラー）
        const COLOR_PALETTE = [
            '#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#9b59b6',
            '#1abc9c', '#e74c3c', '#34495e', '#d35400', '#8e44ad'
        ];
        const OVERLAP_COLOR = '#ff0000'; // 時間重なり時の警告色

        // 部門リスト（画像のスプレッドシートに基づきます）
        const DEPARTMENTS = [
            '不動産部門',
            'GH部門',
            'Cre部門',
            '清掃部門',
            'その他事務作業'
        ];

        let currentYear = 2026;
        let currentMonth = 7; // 0-indexed (7 = 8月)
        let selectedDateStr = ''; // YYYY-MM-DD
        let selectedDayOfWeek = ''; // 曜日

        let records = [];
        let timeChart = null;

        // 初期化
        window.onload = () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
            initChart();

            // Saved GAS URL Restore
            const savedUrl = localStorage.getItem('gas_app_url');
            if(savedUrl) {
                document.getElementById('gas-url').value = savedUrl;
            }
        };

        function saveGasUrl() {
            const url = document.getElementById('gas-url').value;
            localStorage.setItem('gas_app_url', url);
        }

        /* ----- カレンダー描画処理 ----- */
        function changeMonth(diff) {
            currentMonth += diff;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calendar-month-title').textContent = `${currentYear}年 ${currentMonth + 1}月`;
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);

            const startDayOfWeek = firstDay.getDay(); // 0: Sun
            const totalDays = lastDay.getDate();

            // 前月の空白セル
            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                container.appendChild(emptyCell);
            }

            const weekNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];

            // 今月のセル
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const dateObj = new Date(currentYear, currentMonth, day);
                const dayOfWeekIdx = dateObj.getDay();

                cell.className = 'day-cell';
                if (dayOfWeekIdx === 0) cell.classList.add('sun');
                if (dayOfWeekIdx === 6) cell.classList.add('sat');

                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const weekStr = weekNames[dayOfWeekIdx];

                cell.innerHTML = `
                    <div class="day-num">${day}</div>
                    <div class="day-week">${weekStr.replace('曜日','')}</div>
                `;

                cell.onclick = () => selectDate(dateStr, weekStr);
                container.appendChild(cell);
            }
        }

        function selectDate(dateStr, weekStr) {
            selectedDateStr = dateStr;
            selectedDayOfWeek = weekStr;

            document.getElementById('selected-date-display').textContent = `${selectedDateStr} (${selectedDayOfWeek}) の作業記録`;
            
            // 入力データの初期化（デフォルトで1件作成）
            records = [];
            addRecord('09:00', 1);

            document.getElementById('screen-calendar').classList.remove('active');
            document.getElementById('screen-input').classList.add('active');
        }

        function showCalendarScreen() {
            document.getElementById('screen-input').classList.remove('active');
            document.getElementById('screen-calendar').classList.add('active');
        }

        /* ----- レコード管理 ----- */
        function addRecord(defaultStart = null, defaultDuration = 1) {
            let start = defaultStart;
            if (!start) {
                if (records.length > 0) {
                    // 上部のレコードの終了時間をデフォルト開始時間にする
                    start = records[records.length - 1].endTime;
                } else {
                    start = '09:00';
                }
            }

            const color = COLOR_PALETTE[records.length % COLOR_PALETTE.length];
            const newRecord = {
                id: Date.now() + Math.random(),
                startTime: start,
                duration: defaultDuration, // スライダー（時間）
                endTime: calculateEndTime(start, defaultDuration),
                dept: DEPARTMENTS[0],
                memo: '',
                color: color
            };

            records.push(newRecord);
            renderRecords();
            updateChartAndValidation();
        }

        function deleteRecord(id) {
            if (records.length <= 1) {
                alert('最低1つのレコードが必要です。');
                return;
            }
            records = records.filter(r => r.id !== id);
            renderRecords();
            updateChartAndValidation();
        }

        function calculateEndTime(startStr, durationHours) {
            if (!startStr || !startStr.includes(':')) return '00:00';
            const parts = startStr.split(':');
            let h = parseInt(parts[0], 10);
            let m = parseInt(parts[1], 10);

            if (isNaN(h)) h = 0;
            if (isNaN(m)) m = 0;

            let endH = h + parseInt(durationHours, 10);
            // 24時間を越える表記対応 (スプレッドシート形式 27:30 などの表現)
            const formattedH = String(endH).padStart(2, '0');
            const formattedM = String(m).padStart(2, '0');
            return `${formattedH}:${formattedM}`;
        }

        function updateRecordField(id, field, value) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            if (field === 'startTime') {
                rec.startTime = value;
                rec.endTime = calculateEndTime(rec.startTime, rec.duration);
            } else if (field === 'duration') {
                rec.duration = parseInt(value, 10);
                rec.endTime = calculateEndTime(rec.startTime, rec.duration);
            } else if (field === 'dept') {
                rec.dept = value;
            } else if (field === 'memo') {
                rec.memo = value;
            }

            // 終了時間表示更新
            const endInput = document.getElementById(`end-time-${id}`);
            if (endInput) endInput.value = rec.endTime;

            const durationDisplay = document.getElementById(`duration-val-${id}`);
            if (durationDisplay) durationDisplay.textContent = `${rec.duration} 時間`;

            updateChartAndValidation();
        }

        function renderRecords() {
            const container = document.getElementById('records-container');
            container.innerHTML = '';

            records.forEach((rec, idx) => {
                const card = document.createElement('div');
                card.className = 'record-card';
                card.style.borderLeftColor = rec.color;

                const deptOptions = DEPARTMENTS.map(d => 
                    `<option value="${d}" ${rec.dept === d ? 'selected' : ''}>${d}</option>`
                ).join('');

                card.innerHTML = `
                    <div class="record-header">
                        <div class="record-title">
                            <span class="color-badge" style="background:${rec.color};"></span>
                            レコード #${idx + 1}
                        </div>
                        ${records.length > 1 ? `<button class="btn-delete" onclick="deleteRecord(${rec.id})">削除</button>` : ''}
                    </div>

                    <div class="time-row">
                        <!-- ① 開始時間入力 (手入力限定) -->
                        <div class="field-group">
                            <label>① 開始時間 (手入力)</label>
                            <input type="text" placeholder="09:00" value="${rec.startTime}" 
                                onchange="updateRecordField(${rec.id}, 'startTime', this.value)">
                        </div>

                        <!-- ② 終了時刻エリア (入力不可/読み取り専用) -->
                        <div class="field-group">
                            <label>② 終了時刻 (自動計算)</label>
                            <input type="text" id="end-time-${rec.id}" value="${rec.endTime}" readonly>
                        </div>
                    </div>

                    <!-- ③ スライダー (1～12時間増減) -->
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>③ 経過時間スライダー (最大12時間)</span>
                            <span id="duration-val-${rec.id}" style="color:var(--primary-color);">${rec.duration} 時間</span>
                        </div>
                        <input type="range" min="1" max="12" step="1" value="${rec.duration}"
                            oninput="updateRecordField(${rec.id}, 'duration', this.value)">
                    </div>

                    <div class="form-row">
                        <!-- ④ 業務区分ドロップダウン -->
                        <div class="field-group">
                            <label>④ 業務区分</label>
                            <select onchange="updateRecordField(${rec.id}, 'dept', this.value)">
                                ${deptOptions}
                            </select>
                        </div>
                    </div>

                    <!-- ⑤ 備考欄 -->
                    <div class="field-group" style="margin-top:10px;">
                        <label>⑤ 備考 (自由テキスト入力)</label>
                        <textarea rows="2" placeholder="作業内容のメモなど" 
                            onchange="updateRecordField(${rec.id}, 'memo', this.value)">${rec.memo}</textarea>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /* ----- 円グラフ & 重なり検出 ----- */
        function initChart() {
            const ctx = document.getElementById('timeChart').getContext('2d');
            timeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [],
                    datasets: [{
                        data: [],
                        backgroundColor: [],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr || !timeStr.includes(':')) return 0;
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function updateChartAndValidation() {
            // 24時間 (1440分) のタイムスロット配列 (1分刻み)
            // 0: 空白, 1: 単一使用, 2以上: 重なり
            const minutesInDay = 24 * 60;
            const usage = new Array(minutesInDay).fill(0);
            const recordUsage = new Array(minutesInDay).fill(null);

            let hasOverlap = false;

            records.forEach(rec => {
                const startMin = parseTimeToMinutes(rec.startTime);
                const endMin = startMin + (rec.duration * 60);

                for (let m = startMin; m < endMin; m++) {
                    const normalizedM = m % minutesInDay; // 24時超え用
                    usage[normalizedM] += 1;
                    if (usage[normalizedM] > 1) {
                        hasOverlap = true;
                    }
                    recordUsage[normalizedM] = rec;
                }
            });

            // 警告表示切り替え
            const warningEl = document.getElementById('overlap-warning');
            if (hasOverlap) {
                warningEl.style.display = 'block';
            } else {
                warningEl.style.display = 'none';
            }

            // 円グラフセグメントの構築（連続する同一ステータスをバインド）
            const chartLabels = [];
            const chartData = [];
            const chartColors = [];

            let currentSegment = null;

            for (let m = 0; m < minutesInDay; m++) {
                const state = usage[m];
                let color = '#e0e0e0'; // 未割り当て背景
                let label = '未割り当て';

                if (state > 1) {
                    color = OVERLAP_COLOR;
                    label = '⚠️ 重複エラー';
                } else if (state === 1) {
                    const rec = recordUsage[m];
                    color = rec.color;
                    label = `${rec.startTime}~ ${rec.dept}: ${rec.memo || '作業'}`;
                }

                if (!currentSegment || currentSegment.color !== color || currentSegment.label !== label) {
                    if (currentSegment) {
                        chartLabels.push(currentSegment.label);
                        chartData.push(currentSegment.count);
                        chartColors.push(currentSegment.color);
                    }
                    currentSegment = { label, color, count: 1 };
                } else {
                    currentSegment.count++;
                }
            }

            if (currentSegment) {
                chartLabels.push(currentSegment.label);
                chartData.push(currentSegment.count);
                chartColors.push(currentSegment.color);
            }

            // グラフ更新
            timeChart.data.labels = chartLabels;
            timeChart.data.datasets[0].data = chartData;
            timeChart.data.datasets[0].backgroundColor = chartColors;
            timeChart.update();
        }

        /* ----- データ送信 (GASスプレッドシート連携) ----- */
        function submitData() {
            const gasUrl = document.getElementById('gas-url').value.trim();

            const payload = records.map(r => ({
                startDateTime: `${selectedDateStr} ${r.startTime}`,
                endDateTime: `${selectedDateStr} ${r.endTime}`,
                dayOfWeek: selectedDayOfWeek,
                department: r.dept,
                workHours: `${r.duration}:00`,
                memo: r.memo
            }));

            if (!gasUrl) {
                alert("送信先のGAS URLが設定されていません。\n画面下部の「⚙ Webhook / GAS送信先URLの設定」にURLを入力してください。\n\n【プレビュー表示】以下のデータが送信されます:\n" + JSON.stringify(payload, null, 2));
                return;
            }

            // GASへデータ送信 (POST)
            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors', // GAS CORS回避
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('スプレッドシートへの送信リクエストを完了しました！');
                showCalendarScreen();
            })
            .catch(err => {
                alert('送信エラーが発生しました: ' + err.message);
            });
        }
    </script>
</body>
</html>
